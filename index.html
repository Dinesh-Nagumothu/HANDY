<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Notes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <h4 id="main-title" class="mb-3 text-center">
        <span id="main-title-x">X</span>
        <span id="main-title-text">-Notes</span>
      </h4>

      <div id="top-controls">
        <div class="left-space"></div>
        <div id="addNew" data-bs-toggle="modal" data-bs-target="#form">
          <span class="white-text"
            >Well Designed Checklists Can Improve Outcomes</span
          >
          <i class="fas fa-plus"></i>
        </div>
        <div class="search-box">
          <button class="btn-search"><i class="fas fa-search"></i></button>
          <input type="text" class="input-search" placeholder=" Search..." />
        </div>
      </div>

      <form
        class="modal fade"
        id="form"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div>
                <p>Title</p>
                <input type="text" class="form-control" id="textInput" />
                <div id="taskMsg" class="taskname-error-msg error-msg"></div>
              </div>
              <br />
              <div>
                <p>Created</p>
                <input
                  type="date"
                  class="form-control"
                  id="creationDateInput"
                />
                <div
                  id="creationDateMsg"
                  class="creation-date-error-msg error-msg"
                ></div>
              </div>
              <br />
              <div>
                <p>Due</p>
                <input type="date" class="form-control" id="dateInput" />
                <div id="dateMsg" class="due-date-error-msg error-msg"></div>
              </div>
              <br />
              <div>
                <p>Description</p>
                <textarea
                  class="form-control"
                  id="textarea"
                  cols="2"
                  rows="1"
                ></textarea>
                <div
                  id="descriptionMsg"
                  class="description-error-msg error-msg"
                ></div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-danger"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="submit" id="add" class="btn btn-primary">
                Add
              </button>
            </div>
          </div>
        </div>
      </form>

      <div id="tasks"></div>
    </div>

    <script src="main.jsx"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script>
      // minimum date for creation and due date inputs to current date
      const currentDate = new Date().toISOString().split("T")[0];
      document.getElementById("creationDateInput").min = currentDate;
      document.getElementById("dateInput").min = currentDate;

      // Task Deletion
      const tasksDiv = document.getElementById("tasks");
      tasksDiv.addEventListener("click", (event) => {
        if (
          event.target.classList.contains("fas") &&
          event.target.classList.contains("fa-trash-alt")
        ) {
          const taskId = event.target.parentElement.parentElement.id;
          document.getElementById(taskId).remove();
        }
      });

      // Reset form inputs when modal is shown
      const formModal = document.getElementById("form");
      formModal.addEventListener("show.bs.modal", () => {
        formModal.querySelector("form").reset();
      });
    </script>
  </body>
</html>
